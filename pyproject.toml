[project]
name = "signalpost"
version = "0.1.0"
description = "Signalpost: evidence-bound Norwegian company research agent (Builderr hackathon)"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "extruct>=0.18,<1",
  "httpx>=0.27,<1",
  "lxml>=6,<7",
  "pydantic>=2.12,<3",
  "pypdf>=6,<7",
  "tldextract>=5.3,<6",
  "trafilatura>=2.0,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "kit/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["kit", "tests/fixtures"]
